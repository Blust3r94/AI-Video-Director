services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: avid
      POSTGRES_PASSWORD: avid
      POSTGRES_DB: avid
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres-data:
