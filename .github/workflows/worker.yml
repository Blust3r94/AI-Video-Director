name: Process job queue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: worker-queue
  cancel-in-progress: false

jobs:
  process-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run worker:once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Falls back to the mock provider automatically when this secret isn't set yet.
          FAL_KEY: ${{ secrets.FAL_KEY }}
          FAL_MODEL_ID: ${{ vars.FAL_MODEL_ID }}
